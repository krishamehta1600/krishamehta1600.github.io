<!DOCTYPE html>
<html lang="en" class="locked">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Into the Mind — Portfolio</title>
<link rel="icon" href="data:,">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { overflow-x: hidden; }
  html.locked { overflow: hidden; }
  body { background: #1a0d10; font-family: "Futura", "Avenir Next", "Helvetica Neue", sans-serif; }

  /* ---------- scroll track (invisible, drives progress) ---------- */
  #track { width: 100%; }

  /* ---------- fixed stage ---------- */
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    background: #1a0d10;
  }
  /* world = 1920x1248 design space, cover-fit to viewport */
  .world {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1248px;
    transform: translate(-50%, -50%);
    will-change: transform;
  }
  .frame {
    position: absolute; inset: 0;
    opacity: 0; visibility: hidden;
    will-change: transform, opacity;
  }
  .frame img { pointer-events: none; user-select: none; -webkit-user-drag: none; }
  .frame .bg {
    position: absolute; left: 0; top: 0; width: 1920px; height: 1248px;
    object-fit: cover;
  }
  .frame .astro {
    position: absolute;
    will-change: transform;
  }
  .astro-bob { animation: bob 5.2s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -7px; }
  }

  /* soft vignette to unify frames */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(ellipse at center, transparent 58%, rgba(20, 8, 12, .38) 100%);
  }
  /* fog band at transitions */
  #veil {
    position: fixed; inset: 0; pointer-events: none; z-index: 6;
    background: radial-gradient(ellipse at center, rgba(255, 205, 205, .16), rgba(60, 20, 28, .30));
    opacity: 0; transition: none;
  }

  /* ---------- intro video ---------- */
  #intro {
    position: fixed; inset: 0; z-index: 40; background: #1a0d10;
    transition: opacity 1.4s ease;
  }
  #intro.hidden { opacity: 0; pointer-events: none; }
  #intro video {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  #intro .controls {
    position: absolute; right: 28px; bottom: 28px; display: flex; gap: 10px; z-index: 2;
  }
  .pill {
    border: 1px solid rgba(255, 235, 235, .45); color: #ffecec;
    background: rgba(30, 10, 14, .35); backdrop-filter: blur(8px);
    font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 999px; cursor: pointer;
    transition: background .3s, border-color .3s;
  }
  .pill:hover { background: rgba(255, 235, 235, .18); border-color: #ffecec; }

  /* ---------- HUD ---------- */
  #hud {
    position: fixed; z-index: 20; inset: 0; pointer-events: none;
    opacity: 0; transition: opacity 1s ease .4s;
    color: #ffe9e9;
  }
  #hud.on { opacity: 1; }
  #brand {
    position: absolute; top: 30px; left: 36px;
    font-size: 12px; letter-spacing: .34em; text-transform: uppercase;
    text-shadow: 0 1px 14px rgba(60, 10, 20, .6);
  }
  #counter {
    position: absolute; top: 30px; right: 36px;
    font-size: 12px; letter-spacing: .28em;
    text-shadow: 0 1px 14px rgba(60, 10, 20, .6);
    font-variant-numeric: tabular-nums;
  }
  #bar {
    position: absolute; left: 0; bottom: 0; height: 2px; width: 100%;
    background: rgba(255, 233, 233, .14);
  }
  #bar i {
    display: block; height: 100%; width: 0%;
    background: linear-gradient(90deg, #ffb9c0, #ffe9e9);
  }
  #hint {
    position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
    font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
    opacity: .85; text-shadow: 0 1px 14px rgba(60, 10, 20, .7);
    animation: pulse 2.6s ease-in-out infinite;
    text-align: center; white-space: nowrap;
  }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: .95; } }

  #introHint {
    position: absolute; bottom: 34px; left: 50%; transform: translateX(-50%);
    color: #ffe9e9; font-size: 11px; letter-spacing: .3em; text-transform: uppercase;
    text-shadow: 0 1px 14px rgba(60, 10, 20, .7); white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity 1s ease;
  }
  #introHint.on { opacity: 1; animation: pulse 2.6s ease-in-out infinite; }

  /* click-to-enter CTA on frame 16 */
  #enter {
    position: fixed; z-index: 22; left: 50%; bottom: 60px; transform: translateX(-50%);
    pointer-events: none; opacity: 0; transition: opacity .8s ease;
  }
  #enter.on { opacity: 1; pointer-events: auto; }
  #enter .pill { font-size: 12px; padding: 14px 30px; animation: pulse 2.6s ease-in-out infinite; }

  #stage.clickable { cursor: pointer; }

  /* ---------- project page state ---------- */
  #back {
    position: fixed; z-index: 30; top: 30px; left: 36px;
    opacity: 0; pointer-events: none; transition: opacity .8s ease;
  }
  #back.on { opacity: 1; pointer-events: auto; }

  @media (max-width: 700px) {
    #brand { left: 20px; }
    #counter { right: 20px; }
  }
</style>
</head>
<body>

<div id="track"></div>

<div id="stage">
  <div class="world" id="world"></div>
</div>
<div id="veil"></div>
<div id="vignette"></div>

<div id="hud">
  <div id="brand">Into the Mind</div>
  <div id="counter">01 / 16</div>
  <div id="hint">Scroll to go deeper</div>
  <div id="bar"><i id="barfill"></i></div>
</div>

<div id="enter"><button class="pill" id="enterBtn">Enter the treasures</button></div>
<div id="back"><button class="pill" id="backBtn">&larr; Back to the journey</button></div>

<div id="intro">
  <video id="vid" src="assets/video.mp4" poster="assets/poster.jpg" muted autoplay playsinline preload="auto"></video>
  <div class="controls">
    <button class="pill" id="soundBtn">Sound on</button>
    <button class="pill" id="skipBtn">Skip intro</button>
  </div>
  <div id="introHint">Scroll to enter the mind</div>
</div>

<script>
/* astronaut cutout boxes in 1920x1248 world coords: [x0, y0, x1, y1] */
const LAYERS = {
  p01: [751, 332, 1101, 1120],  p02: [254, 155, 811, 1248],
  p03: [841, 453, 1072, 956],   p04: [934, 562, 1044, 802],
  p05: [797, 568, 1000, 1036],  p06: [777, 663, 1013, 1189],
  p07: [856, 586, 1065, 1048],  p08: [840, 536, 1067, 1037],
  p09: [906, 599, 1157, 1223],  p10: [845, 600, 1059, 1026],
  p11: [812, 459, 1116, 925],   p12: [823, 501, 1105, 936],
  p13: [0, 385, 674, 1248],     p14: [826, 573, 1069, 1154],
  p15: [822, 692, 1071, 1248],  p16: [623, 714, 798, 1112],
  project: [620, 715, 795, 1102],
};
const SLUGS = ["p02", "p03", "p05", "p11", "p13", "p14", "p15", "p16"];
const N = SLUGS.length;
const W = 1920, H = 1248;
/* transition i -> i+1: len = scroll length (viewport-heights), dwell = rest fraction,
   deep = pure zoom-in (no early crossfade), zoom = extra scale, origin = zoom focal point */
const TRANS = [
  { len: 1.35, dwell: 0.42, deep: false },                              /* 02 -> 03 */
  { len: 2.30, dwell: 0.20, deep: true, zoom: 1.6, origin: "55% 30%" }, /* 03 zooms (04 removed) */
  { len: 2.70, dwell: 0.20, deep: true, zoom: 2.2, origin: "51% 38%" }, /* 05 zooms (06-10 removed) */
  { len: 2.30, dwell: 0.20, deep: true, zoom: 1.6, origin: "50% 30%" }, /* 11 zooms (12 removed) */
  { len: 1.35, dwell: 0.42, deep: false },                              /* 13 -> 14 */
  { len: 1.60, dwell: 0.30, deep: true, zoom: 0.9, origin: "58% 42%" }, /* 14 -> 15 zoom-match */
  { len: 1.35, dwell: 0.42, deep: false },                              /* 15 -> 16 */
];
const CUM = [0];
for (const tr of TRANS) CUM.push(CUM[CUM.length - 1] + tr.len);

const world = document.getElementById("world");
const stage = document.getElementById("stage");
const track = document.getElementById("track");
const veil = document.getElementById("veil");
const counter = document.getElementById("counter");
const barfill = document.getElementById("barfill");
const hint = document.getElementById("hint");
const enterCta = document.getElementById("enter");
const hud = document.getElementById("hud");
const backBtn = document.getElementById("back");

/* build frame layers (project page included as index N) */
const frames = [];
for (const slug of [...SLUGS, "project"]) {
  const f = document.createElement("div");
  f.className = "frame";
  const bg = new Image();
  bg.className = "bg";
  bg.src = `assets/bg/${slug}.jpg`;
  f.appendChild(bg);
  const box = LAYERS[slug];
  const wrap = document.createElement("div");
  wrap.className = "astro-bob";
  wrap.style.cssText = `position:absolute;left:${box[0]}px;top:${box[1]}px;width:${box[2]-box[0]}px;height:${box[3]-box[1]}px;`;
  const astro = new Image();
  astro.className = "astro";
  astro.src = `assets/cut/${slug}.png`;
  astro.style.cssText = "left:0;top:0;width:100%;height:100%;";
  wrap.appendChild(astro);
  f.appendChild(wrap);
  f._bg = bg; f._astro = wrap;
  world.appendChild(f);
  frames.push(f);
}

/* ---------- persistent walker ----------
   One astronaut that never crossfades: two mid-stride back-view cutouts form a
   2-frame walk cycle; his anchor (position/size) glides between scenes while the
   worlds change behind him. Frames p02/p13 stay as cinematic close-up cuts. */
const WALK_GRADE = {   /* walk frames: [brightness, saturate] to match scene light */
  p03: [0.50, 0.88], p05: [0.82, 1.0], p11: [1.06, 1.0],
  p14: [0.96, 1.05], p15: [0.92, 1.05], p16: [0.86, 1.0],
};
const walker = document.createElement("div");
walker.style.cssText = "position:absolute;pointer-events:none;will-change:transform,opacity;opacity:0;";
const strides = ["p16", "project"].map((slug, k) => {
  const im = new Image();
  im.src = `assets/cut/${slug}.png`;
  im.style.cssText = `position:absolute;left:50%;bottom:0;height:100%;transform:translateX(-50%);opacity:${k === 0 ? 1 : 0};`;
  walker.appendChild(im);
  return im;
});
world.appendChild(walker);
/* hide the baked-in astronauts on frames the walker covers */
SLUGS.forEach((slug, idx) => { if (WALK_GRADE[slug]) frames[idx]._astro.style.display = "none"; });
const anchorOf = slug => {
  const b = LAYERS[slug];
  return { cx: (b[0] + b[2]) / 2, by: b[3], h: b[3] - b[1] };
};
const STRIDE = 0.16;             /* scroll distance (viewport-heights) per footstep */
let walkDist = 0, prevCurrent = 0;

/* cover-fit the 1920x1248 world to the viewport */
function fitWorld() {
  const s = Math.max(innerWidth / W, innerHeight / H);
  world.style.transform = `translate(-50%,-50%) scale(${s})`;
  track.style.height = (CUM[N - 1] * innerHeight + innerHeight) + "px";
}
addEventListener("resize", fitWorld);
fitWorld();

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeIO = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

/* mouse depth parallax */
let mx = 0, my = 0, smx = 0, smy = 0;
addEventListener("mousemove", e => {
  mx = (e.clientX / innerWidth - .5) * 2;
  my = (e.clientY / innerHeight - .5) * 2;
});

/* virtual smoothed progress */
let target = 0, current = 0;
let mode = "intro";              /* intro | scroll | project */

function readScroll() {
  const s = scrollY / innerHeight;
  let i = 0;
  while (i < N - 2 && s >= CUM[i + 1]) i++;
  target = clamp(i + (s - CUM[i]) / TRANS[i].len, 0, N - 1);
}
addEventListener("scroll", readScroll, { passive: true });

function setFrame(f, { op, sc, ax, ay, as, vis, aop }) {
  f.style.visibility = vis ? "visible" : "hidden";
  if (!vis) return;
  f.style.opacity = op;
  f.style.transform = `scale(${sc})`;
  f._astro.style.transform = `translate(${ax}px, ${ay}px) scale(${as})`;
  f._astro.style.opacity = aop === undefined ? 1 : aop;
}

let projectT = 0;                /* 0 = journey, 1 = project page */

function render() {
  requestAnimationFrame(render);
  if (mode === "intro") return;

  current += (target - current) * 0.085;
  smx += (mx - smx) * 0.06;
  smy += (my - smy) * 0.06;

  const i = clamp(Math.floor(current), 0, N - 1);
  const frac = current - i;
  const cfg = TRANS[Math.min(i, TRANS.length - 1)];
  const tRaw = clamp((frac - cfg.dwell) / (1 - cfg.dwell), 0, 1);  /* transition amount to next */
  const t = easeIO(tRaw);

  /* hide all, then paint the 1-3 frames involved */
  for (const f of frames) f.style.visibility = "hidden";

  const px = smx * 10, py = smy * 7;      /* bg mouse drift */
  const ax = smx * -16, ay = smy * -10;   /* astronaut counter-drift (deeper) */

  if (mode === "scroll" || projectT > 0) {
    /* current frame: rest zoom (Ken Burns) then zoom-in during transition */
    const rest = 1 + frac * 0.045;
    frames[i].style.transformOrigin = cfg.deep ? cfg.origin : "center";
    if (cfg.deep) {
      /* pure zoom: stay fully visible, dive toward the focal point, fade only at the tail */
      setFrame(frames[i], {
        vis: true,
        op: 1 - Math.max(0, (t - 0.8) / 0.2),
        sc: rest + t * cfg.zoom,
        ax: ax, ay: ay - t * 20, as: 1 + t * 0.05,
      });
    } else {
      setFrame(frames[i], {
        vis: true,
        op: 1 - t,
        sc: rest + t * 0.22,
        ax: ax, ay: ay - t * 30, as: 1 + t * 0.1,
      });
    }
    frames[i]._bg.style.transform = `translate(${px}px, ${py}px) scale(1.03)`;

    /* incoming frame */
    if (t > 0 && i + 1 < N) {
      frames[i + 1].style.transformOrigin = "center";
      if (cfg.deep) {
        const fi = clamp((t - 0.55) / 0.45, 0, 1);
        setFrame(frames[i + 1], {
          vis: fi > 0,
          op: fi,
          sc: 1.1 - fi * 0.1,
          ax: ax * .6, ay: ay * .6, as: 1,
          aop: clamp((t - 0.85) / 0.15, 0, 1),  /* one astronaut at a time */
        });
      } else {
        setFrame(frames[i + 1], {
          vis: true,
          op: t,
          sc: 1.14 - t * 0.14 + 0.000001,
          ax: ax * .6, ay: ay * .6 + (1 - t) * 24, as: 1,
        });
      }
      frames[i + 1]._bg.style.transform = `translate(${px * .6}px, ${py * .6}px) scale(1.03)`;
    }
    veil.style.opacity = (t > 0 ? Math.sin(t * Math.PI) * (cfg.deep ? .4 : .55) : 0);
  }

  /* project page overlay transition */
  const ptE = easeIO(projectT);
  if (projectT > 0) {
    const last = frames[N - 1], proj = frames[N];
    setFrame(last, { vis: projectT < 1, op: 1 - ptE, sc: 1 + ptE * 0.3, ax, ay, as: 1 + ptE * .1 });
    setFrame(proj, { vis: true, op: ptE, sc: 1.12 - ptE * 0.12, ax: ax * .5, ay: ay * .5, as: 1,
                     aop: clamp((ptE - 0.5) / 0.5, 0, 1) });
    proj._bg.style.transform = `translate(${px * .5}px, ${py * .5}px) scale(1.03)`;
    veil.style.opacity = Math.sin(ptE * Math.PI) * .5;
  }

  /* --- persistent walker --- */
  walkDist += Math.abs(current - prevCurrent) * TRANS[Math.min(i, TRANS.length - 1)].len;
  prevCurrent = current;
  const phase = walkDist / STRIDE;
  const stepA = Math.floor(phase) % 2 === 0;
  strides[0].style.opacity = stepA ? 1 : 0;
  strides[1].style.opacity = stepA ? 0 : 1;

  const gNow = WALK_GRADE[SLUGS[i]];
  const gNext = i + 1 < N ? WALK_GRADE[SLUGS[i + 1]] : null;
  let wop = 0, a = null, grade = null;
  const lerp = (u, v, k) => u + (v - u) * k;
  if (gNow && gNext) {
    const a0 = anchorOf(SLUGS[i]), a1 = anchorOf(SLUGS[i + 1]);
    a = { cx: lerp(a0.cx, a1.cx, t), by: lerp(a0.by, a1.by, t), h: lerp(a0.h, a1.h, t) };
    grade = [lerp(gNow[0], gNext[0], t), lerp(gNow[1], gNext[1], t)];
    wop = 1;
  } else if (gNow) {          /* walking toward a close-up cut: fade out late */
    a = anchorOf(SLUGS[i]); grade = gNow;
    wop = 1 - clamp((t - 0.65) / 0.35, 0, 1);
  } else if (gNext) {         /* leaving a cut: walker fades back in */
    a = anchorOf(SLUGS[i + 1]); grade = gNext;
    wop = clamp((t - 0.65) / 0.35, 0, 1);
  }
  wop *= 1 - ptE;             /* hand off to the project page's own astronaut */
  if (a && wop > 0.003 && mode !== "intro") {
    const bob = Math.abs(Math.sin(phase * Math.PI)) * -6;
    const sway = Math.sin(phase * Math.PI) * 1.3;
    const wdt = a.h * 0.45;
    walker.style.opacity = wop;
    walker.style.left = (a.cx - wdt / 2 + ax) + "px";
    walker.style.top = (a.by - a.h + ay + bob) + "px";
    walker.style.width = wdt + "px";
    walker.style.height = a.h + "px";
    walker.style.transform = `rotate(${sway}deg)`;
    walker.style.filter = `brightness(${grade[0]}) saturate(${grade[1]}) drop-shadow(0 12px 16px rgba(40,5,15,.45))`;
  } else {
    walker.style.opacity = 0;
  }

  /* HUD */
  const shown = clamp(Math.round(current + tRaw * 0.5) + 1, 1, N);
  counter.textContent = mode === "project"
    ? "Projects"
    : String(shown).padStart(2, "0") + " / " + String(N).padStart(2, "0");
  barfill.style.width = (current / (N - 1) * 100) + "%";

  const atEnd = current > N - 1.05 && mode === "scroll";
  enterCta.classList.toggle("on", atEnd);
  stage.classList.toggle("clickable", atEnd);
  hint.style.display = current > 0.2 ? "none" : "";
}
requestAnimationFrame(render);

/* ---------- intro handling ---------- */
const intro = document.getElementById("intro");
const vid = document.getElementById("vid");
const soundBtn = document.getElementById("soundBtn");

function startJourney() {
  if (mode !== "intro") return;
  mode = "scroll";
  intro.classList.add("hidden");
  document.documentElement.classList.remove("locked");
  hud.classList.add("on");
  scrollTo(0, 0);
  target = current = 0;
  vid.pause();
  setTimeout(() => intro.remove(), 1600);
}
/* freeze on the video's last frame; the next scroll gesture begins the journey */
vid.addEventListener("ended", () => {
  if (mode !== "intro") return;
  document.getElementById("introHint").classList.add("on");
  addEventListener("wheel", startJourney, { once: true, passive: true });
  addEventListener("touchmove", startJourney, { once: true, passive: true });
  addEventListener("keydown", startJourney, { once: true });
  intro.addEventListener("click", startJourney, { once: true });
});
document.getElementById("skipBtn").addEventListener("click", startJourney);
soundBtn.addEventListener("click", () => {
  vid.muted = !vid.muted;
  soundBtn.textContent = vid.muted ? "Sound on" : "Sound off";
});
/* if autoplay is blocked, first click plays */
vid.play().catch(() => {
  intro.addEventListener("click", () => vid.play(), { once: true });
});

/* ---------- project page transition ---------- */
let projectAnim = null;
function toProject() {
  if (mode !== "scroll" || current < N - 1.05) return;
  mode = "project";
  document.documentElement.classList.add("locked");
  enterCta.classList.remove("on");
  stage.classList.remove("clickable");
  backBtn.classList.add("on");
  counter.textContent = "Projects";
  animateProject(1);
}
function backToJourney() {
  mode = "scroll";
  document.documentElement.classList.remove("locked");
  backBtn.classList.remove("on");
  animateProject(0);
}
function animateProject(dest) {
  cancelAnimationFrame(projectAnim);
  const step = () => {
    projectT += (dest - projectT) * 0.07;
    if (Math.abs(dest - projectT) < 0.002) { projectT = dest; return; }
    projectAnim = requestAnimationFrame(step);
  };
  step();
}
document.getElementById("enterBtn").addEventListener("click", toProject);
stage.addEventListener("click", () => { if (stage.classList.contains("clickable")) toProject(); });
document.getElementById("backBtn").addEventListener("click", backToJourney);

/* keyboard: arrows/space step through frames */
addEventListener("keydown", e => {
  if (mode !== "scroll") return;
  const idx = Math.round(current);
  if (e.key === "ArrowDown" || e.key === "PageDown" || e.key === " ")
    scrollTo({ top: CUM[clamp(idx + 1, 0, N - 1)] * innerHeight, behavior: "smooth" }), e.preventDefault();
  if (e.key === "ArrowUp" || e.key === "PageUp")
    scrollTo({ top: CUM[clamp(idx - 1, 0, N - 1)] * innerHeight, behavior: "smooth" }), e.preventDefault();
});
</script>
</body>
</html>
