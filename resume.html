<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resume — Krisha Mehta</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #0d0409; color: #ffe9e9; display: flex; flex-direction: column;
    font-family: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  /* The same pill the rest of the site uses, so leaving the resume looks like
     every other control rather than like a browser affordance. */
  .bar {
    flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between;
    gap: 16px; padding: 18px 24px;
  }
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid rgba(255, 235, 235, .45); color: #ffecec;
    background: rgba(30, 10, 14, .35); backdrop-filter: blur(8px);
    font-family: inherit; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
    padding: 10px 18px; border-radius: 999px; cursor: pointer; text-decoration: none;
    transition: background .3s, border-color .3s;
  }
  .pill:hover { background: rgba(255, 235, 235, .18); border-color: #ffecec; }
  .doc { flex: 1 1 auto; min-height: 0; position: relative; }
  .doc object { width: 100%; height: 100%; border: 0; display: block; }
  /* Shown only when the browser will not render a PDF inline -- iOS Safari
     being the one that matters. Without it those visitors get a blank page. */
  .fallback { height: 100%; overflow: auto; text-align: center; padding: 0 16px 24px; }
  .fallback img { max-width: 100%; height: auto; border-radius: 4px; }
  .fallback p { font-size: 12px; letter-spacing: .04em; color: #c9a7ad; padding: 14px 0; }
  @media (max-width: 600px) { .bar { padding: 12px 14px; } .pill { padding: 9px 14px; font-size: 10px; } }
</style>
</head>
<body>
  <div class="bar">
    <button class="pill" id="back" type="button">&larr;&nbsp; Back</button>
    <a class="pill" href="assets/resume.pdf" download="Krisha-Mehta-Resume.pdf">Download PDF</a>
  </div>
  <div class="doc">
    <object data="assets/resume.pdf" type="application/pdf" aria-label="Krisha Mehta — resume">
      <div class="fallback">
        <img src="assets/resume-fallback.jpg" alt="Krisha Mehta — graphic and digital designer. Resume.">
        <p>Your browser will not display PDFs inline — use Download PDF above for the original.</p>
      </div>
    </object>
  </div>
<script>
/* Where "back" goes.

   history.back() alone is not enough. The treasures page rewrites its own URL
   to index.html with no hash (closeCase does a pushState to
   location.pathname), so stepping back from here would land on the bare
   landing page and replay the whole fourteen-second film to get where the
   visitor already was. So the page that sent them here says where to return
   to, in ?from, and that is used first.

   The two fallbacks are for arriving without one: a real history entry to step
   back through, or failing even that, the treasures. */
(function () {
  var from = new URLSearchParams(location.search).get("from");
  /* Only ever a path on this site. Anything absolute, protocol-relative or
     otherwise off-origin is discarded rather than followed. */
  var safe = from && /^[\w.\-]+\.html(#[\w-]*)?$/.test(from) ? from : null;
  document.getElementById("back").addEventListener("click", function () {
    if (safe) location.replace(safe);
    else if (history.length > 1) history.back();
    else location.replace("index.html#treasures");
  });
  /* Escape does the same thing, the way it closes a case study. */
  addEventListener("keydown", function (e) {
    if (e.key === "Escape") document.getElementById("back").click();
  });
})();
</script>
</body>
</html>
